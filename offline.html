<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0d9488" />
<title>Offline · Setlo</title>
<link rel="stylesheet" href="assets/css/app.css" />
</head>
<body>
<div class="device device-white auth-layout">
  <div class="auth-hero px-6 pb-14 pt-8">
    <div class="flex items-center gap-2.5 text-white"><img src="assets/icons/icon-192.png" alt="" class="logo-img h-[34px] w-[34px] rounded-[10px]" /><span class="text-[26px] font-extrabold tracking-tight">setlo</span></div>
    <h1 class="mt-6 text-[24px] font-extrabold tracking-tight text-white">You're offline</h1>
  </div>
  <div class="auth-sheet flex flex-1 flex-col px-6 pb-6 pt-8 text-center">
    <p class="text-[14px] text-slate-600">Setlo needs a connection to load balances and confirm payments — we never show you stale amounts.</p>
    <button onclick="location.reload()" class="btn-pill btn-pill-primary mt-6">Try again</button>
  </div>
</div>
</body>
</html>
