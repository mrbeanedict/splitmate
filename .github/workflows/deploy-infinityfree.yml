# Uploads Setlo to the web host by FTP every time you push to the main branch (or press "Run workflow").
# One-time setup in the GitHub repository: Settings > Secrets and variables > Actions > New repository secret:
#   FTP_SERVER    e.g. ftpupload.net     (InfinityFree: shown in the control panel under FTP details)
#   FTP_USERNAME  e.g. if0_12345678
#   FTP_PASSWORD  your FTP / hosting account password
# It never uploads config/local.php or your users' uploads, and it never deletes them: only files it uploaded
# itself are replaced or removed (it keeps a record on the server in .ftp-deploy-sync-state.json).
name: Deploy to InfinityFree

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload by FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir: /htdocs/
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            .vscode/**
            tools/**
            src/**
            tailwind.config.js
            *.md
            config/local.php
            config/installed.lock
            backups/**
